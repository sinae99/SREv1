apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: geoapi
  namespace: argocd
spec:
  project: geoapi
  source:
    repoURL: https://github.com/sinae99/SREv1.git
    targetRevision: main
    path: api/k8s
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: geoapi
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
  revisionHistoryLimit: 10
