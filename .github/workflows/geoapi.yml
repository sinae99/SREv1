name: geoapi

on:
  push:
    branches: [main]
    paths:
      - "api/app.py"
      - "api/test_app.py"
      - "api/requirements.txt"
      - "api/Dockerfile"
      - ".github/workflows/geoapi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoapi-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sinae99/geoapi
  DEPLOYMENT_FILE: api/k8s/deployment.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pytest
        run: pytest -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  update-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update desired image in Git
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["DEPLOYMENT_FILE"])
          image_prefix = f'image: {os.environ["IMAGE"]}:'
          new_image = f'{image_prefix}{os.environ["GITHUB_SHA"]}'
          lines = path.read_text().splitlines()

          for index, line in enumerate(lines):
              if line.strip().startswith(image_prefix):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = f'{indent}{new_image}'
                  break
          else:
              raise SystemExit(f'GeoAPI image was not found in {path}')

          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit desired image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEPLOYMENT_FILE"

          if git diff --cached --quiet; then
            echo "Desired image is already ${IMAGE}:${GITHUB_SHA}"
            exit 0
          fi

          git commit -m "deploy: geoapi ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
