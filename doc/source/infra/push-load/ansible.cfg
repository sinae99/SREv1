[defaults]
# Use the local inventory by default.
inventory = inventory/hosts.ini
# Disable host-key prompts so the playbook can run unattended.
host_key_checking = False
# Avoid retry-file clutter in the repo.
retry_files_enabled = False
# Let Ansible choose a compatible Python automatically.
interpreter_python = auto_silent

[privilege_escalation]
# Containerd import and host-level file work need sudo on the remote nodes.
become = True
become_method = sudo
become_ask_pass = False
